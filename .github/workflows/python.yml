name: Reusable Python CI

on:
  workflow_call:
    inputs:
      project-dir:
        description: Directory containing pyproject.toml and the lockfile, relative to repository root
        required: true
        type: string
      manager:
        description: uv or pip
        required: true
        type: string
      python-versions:
        description: JSON array, for example ["3.11","3.12"]
        required: false
        type: string
        default: '["3.12"]'
      pip-extras:
        description: pip editable-install extras, for example test
        required: false
        type: string
        default: ''
      pip-constraints:
        description: Optional caller-owned constraints file, relative to project-dir
        required: false
        type: string
        default: ''
      test-path:
        description: pytest collection path, relative to project-dir
        required: false
        type: string
        default: tests
      coverage-source:
        description: Module or directory for coverage; empty disables coverage gate
        required: false
        type: string
        default: ''
      coverage-min:
        description: Required coverage percentage when coverage-source is set
        required: false
        type: number
        default: 0
      ruff-version:
        description: Exact Ruff version for pip projects; uv projects use their lockfile
        required: false
        type: string
        default: '0.14.14'
      lint:
        required: false
        type: boolean
        default: true
      build-distribution:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check input contract
        env:
          MANAGER: ${{ inputs.manager }}
          PROJECT_DIR: ${{ inputs.project-dir }}
          PIP_EXTRAS: ${{ inputs.pip-extras }}
          CONSTRAINTS: ${{ inputs.pip-constraints }}
          TEST_PATH: ${{ inputs.test-path }}
          COVERAGE_SOURCE: ${{ inputs.coverage-source }}
          RUFF_VERSION: ${{ inputs.ruff-version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MANAGER" == uv || "$MANAGER" == pip ]]
          [[ "$PROJECT_DIR" =~ ^[A-Za-z0-9_./-]+$ && "$PROJECT_DIR" != *..* ]]
          [[ "$PIP_EXTRAS" =~ ^[A-Za-z0-9_,.-]*$ ]]
          [[ "$CONSTRAINTS" =~ ^[A-Za-z0-9_./-]*$ && "$CONSTRAINTS" != *..* ]]
          [[ "$TEST_PATH" =~ ^[A-Za-z0-9_./-]+$ ]]
          [[ "$COVERAGE_SOURCE" =~ ^[A-Za-z0-9_./-]*$ ]]
          [[ "$RUFF_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

  lint:
    name: Ruff lint and format
    if: inputs.lint
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ fromJSON(inputs.python-versions)[0] }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: inputs.manager == 'uv'
        with:
          enable-cache: true
      - name: Run locked Ruff
        if: inputs.manager == 'uv'
        run: |
          uv sync --all-groups --frozen
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Run pinned Ruff
        if: inputs.manager == 'pip'
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          python -m pip install "ruff==$RUFF_VERSION"
          ruff check .
          ruff format --check .

  test:
    name: Tests on Python ${{ matrix.python }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: inputs.manager == 'uv'
        with:
          enable-cache: true
      - name: Install frozen uv environment
        if: inputs.manager == 'uv'
        run: uv sync --all-groups --frozen
      - name: Install pip project with caller constraints
        if: inputs.manager == 'pip'
        env:
          EXTRAS: ${{ inputs.pip-extras }}
          CONSTRAINTS: ${{ inputs.pip-constraints }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$CONSTRAINTS" ]]; then args=(-c "$CONSTRAINTS"); fi
          python -m pip install "${args[@]}" 'pytest>=8,<10' 'pytest-cov>=5,<8'
          if [[ -n "$EXTRAS" ]]; then
            python -m pip install "${args[@]}" -e ".[$EXTRAS]"
          else
            python -m pip install "${args[@]}" -e .
          fi
      - name: Run tests and coverage gate
        env:
          MANAGER: ${{ inputs.manager }}
          TEST_PATH: ${{ inputs.test-path }}
          COVERAGE_SOURCE: ${{ inputs.coverage-source }}
          COVERAGE_MIN: ${{ inputs.coverage-min }}
        shell: bash
        run: |
          set -euo pipefail
          runner=(python -m pytest)
          if [[ "$MANAGER" == uv ]]; then runner=(uv run --frozen python -m pytest); fi
          args=("$TEST_PATH" -q)
          if [[ -n "$COVERAGE_SOURCE" ]]; then
            args+=("--cov=$COVERAGE_SOURCE" "--cov-fail-under=$COVERAGE_MIN" "--cov-report=xml:coverage.xml" "--cov-report=term-missing")
          fi
          "${runner[@]}" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && inputs.coverage-source != ''
        with:
          name: coverage-python-${{ matrix.python }}
          path: ${{ inputs.project-dir }}/coverage.xml
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Distribution integrity
    if: inputs.build-distribution
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and inspect metadata
        run: |
          python -m pip install 'build==1.2.2.post1' 'twine==6.1.0'
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: ${{ inputs.project-dir }}/dist/
          if-no-files-found: error
          retention-days: 7
