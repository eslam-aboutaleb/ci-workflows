name: Python CI

on:
  workflow_call:
    inputs:
      project-dir:
        description: Directory containing pyproject.toml and the lockfile, relative to repository root
        required: true
        type: string
      manager:
        description: uv or pip
        required: true
        type: string
      python-versions:
        description: JSON array, for example ["3.11","3.12"]
        required: false
        type: string
        default: '["3.12"]'
      operating-systems:
        description: JSON array of GitHub hosted runner labels for unit tests
        type: string
        default: '["ubuntu-latest"]'
      pip-extras:
        description: pip editable-install extras, for example test
        required: false
        type: string
        default: ''
      pip-constraints:
        description: Optional caller-owned constraints file, relative to project-dir
        required: false
        type: string
        default: ''
      test-path:
        description: pytest collection path, relative to project-dir
        required: false
        type: string
        default: tests
      coverage-source:
        description: Module or directory for coverage; empty disables coverage gate
        required: false
        type: string
        default: ''
      coverage-min:
        description: Required coverage percentage when coverage-source is set
        required: false
        type: number
        default: 0
      ruff-version:
        description: Exact Ruff version for pip projects; uv projects use their lockfile
        required: false
        type: string
        default: '0.14.14'
      build-distribution:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check input contract
        env:
          MANAGER: ${{ inputs.manager }}
          PROJECT_DIR: ${{ inputs.project-dir }}
          PIP_EXTRAS: ${{ inputs.pip-extras }}
          CONSTRAINTS: ${{ inputs.pip-constraints }}
          TEST_PATH: ${{ inputs.test-path }}
          COVERAGE_SOURCE: ${{ inputs.coverage-source }}
          RUFF_VERSION: ${{ inputs.ruff-version }}
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          OPERATING_SYSTEMS: ${{ inputs.operating-systems }}
          COVERAGE_MIN: ${{ inputs.coverage-min }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MANAGER" == uv || "$MANAGER" == pip ]]
          [[ "$PROJECT_DIR" == . || ( "$PROJECT_DIR" =~ ^[A-Za-z0-9_./-]+$ && "/$PROJECT_DIR/" != *"/../"* ) ]]
          [[ "$PIP_EXTRAS" =~ ^[A-Za-z0-9_,.-]*$ ]]
          [[ -z "$CONSTRAINTS" || ( "$CONSTRAINTS" =~ ^[A-Za-z0-9_./-]+$ && "/$CONSTRAINTS/" != *"/../"* ) ]]
          [[ "$TEST_PATH" =~ ^[A-Za-z0-9_./-]+$ && "/$TEST_PATH/" != *"/../"* ]]
          [[ -z "$COVERAGE_SOURCE" || ( "$COVERAGE_SOURCE" =~ ^[A-Za-z0-9_./-]+$ && "/$COVERAGE_SOURCE/" != *"/../"* ) ]]
          [[ "$RUFF_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python - <<'PY'
          import json, os
          versions = json.loads(os.environ['PYTHON_VERSIONS'])
          assert isinstance(versions, list) and versions
          assert all(isinstance(v, str) and v.count('.') == 1 and v.split('.')[0] == '3' and all(p.isdigit() for p in v.split('.')) for v in versions)
          assert len(versions) == len(set(versions))
          systems = json.loads(os.environ['OPERATING_SYSTEMS'])
          assert isinstance(systems, list) and systems and all(v in {'ubuntu-latest', 'windows-latest', 'macos-latest'} for v in systems)
          assert len(systems) == len(set(systems)) and len(systems) * len(versions) <= 256
          assert 0 <= float(os.environ['COVERAGE_MIN']) <= 100
          assert not os.environ['COVERAGE_SOURCE'] or float(os.environ['COVERAGE_MIN']) > 0
          PY

  lint:
    name: Ruff lint and format
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(inputs.python-versions)[0] }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Run locked Ruff
        if: inputs.manager == 'uv'
        run: |
          uv sync --all-groups --frozen
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Run pinned Ruff
        if: inputs.manager == 'pip'
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          uv pip install --system --python "$(python -c 'import sys; print(sys.executable)')" "ruff==$RUFF_VERSION"
          ruff check .
          ruff format --check .

  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
        os: ${{ fromJSON(inputs.operating-systems) }}
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
        shell: bash
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install frozen uv environment
        if: inputs.manager == 'uv'
        run: uv sync --all-groups --frozen
      - name: Install pip project with caller constraints
        if: inputs.manager == 'pip'
        env:
          EXTRAS: ${{ inputs.pip-extras }}
          CONSTRAINTS: ${{ inputs.pip-constraints }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$CONSTRAINTS" ]]; then args=(-c "$CONSTRAINTS"); fi
          uv pip install --system --python "$(python -c 'import sys; print(sys.executable)')" "${args[@]}" 'pytest>=8,<10' 'pytest-cov>=5,<8'
          if [[ -n "$EXTRAS" ]]; then
            uv pip install --system --python "$(python -c 'import sys; print(sys.executable)')" "${args[@]}" -e ".[$EXTRAS]"
          else
            uv pip install --system --python "$(python -c 'import sys; print(sys.executable)')" "${args[@]}" -e .
          fi
      - name: Run tests and coverage gate
        env:
          MANAGER: ${{ inputs.manager }}
          TEST_PATH: ${{ inputs.test-path }}
          COVERAGE_SOURCE: ${{ inputs.coverage-source }}
          COVERAGE_MIN: ${{ inputs.coverage-min }}
        shell: bash
        run: |
          set -euo pipefail
          runner=(python -m pytest)
          if [[ "$MANAGER" == uv ]]; then runner=(uv run --frozen python -m pytest); fi
          args=("$TEST_PATH" -q --junitxml=test-results/pytest.xml)
          if [[ -n "$COVERAGE_SOURCE" ]]; then
            args+=("--cov=$COVERAGE_SOURCE" "--cov-fail-under=$COVERAGE_MIN" "--cov-report=xml:coverage.xml" "--cov-report=term-missing")
          fi
          "${runner[@]}" "${args[@]}"
      - name: Create unique coverage artifact name
        id: coverage-artifact
        if: always()
        env:
          PROJECT_DIR: ${{ inputs.project-dir }}
        run: |
          python - <<'PY'
          import hashlib, os, re
          project = os.environ['PROJECT_DIR']
          slug = re.sub(r'[^A-Za-z0-9._-]+', '-', project).strip('-.') or 'root'
          suffix = hashlib.sha256(project.encode()).hexdigest()[:10]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={slug[:80]}-{suffix}\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-${{ steps.coverage-artifact.outputs.name }}-python-${{ matrix.python }}-${{ matrix.os }}
          path: |
            ${{ inputs.project-dir }}/coverage.xml
            ${{ inputs.project-dir }}/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Distribution integrity
    if: inputs.build-distribution
    needs: [validate, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Create unique distribution artifact name
        id: distribution-artifact
        env:
          PROJECT_DIR: ${{ inputs.project-dir }}
        run: |
          python - <<'PY'
          import hashlib, os, re
          project = os.environ['PROJECT_DIR']
          slug = re.sub(r'[^A-Za-z0-9._-]+', '-', project).strip('-.') or 'root'
          suffix = hashlib.sha256(project.encode()).hexdigest()[:10]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={slug[:80]}-{suffix}\n')
          PY
      - name: Build and inspect metadata
        run: |
          uv pip install --system --python "$(python -c 'import sys; print(sys.executable)')" 'build==1.2.2.post1' 'twine==6.1.0'
          python -m build --installer=uv
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist-${{ steps.distribution-artifact.outputs.name }}
          path: ${{ inputs.project-dir }}/dist/
          if-no-files-found: error
          retention-days: 7
