name: Publish container to GHCR

on:
  workflow_call:
    inputs:
      image:
        description: Lowercase ghcr.io/<repository-owner>/<image> name without a tag
        required: true
        type: string
      dockerfile:
        type: string
        default: Dockerfile
      build-context:
        type: string
        default: .
      platforms:
        type: string
        default: linux/amd64
      target:
        type: string
        default: ''
    outputs:
      digest:
        description: Immutable published image digest
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate publishing event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.event.outputs.image }}
      tag: ${{ steps.event.outputs.tag }}
    steps:
      - id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
        run: |
          python3 - <<'PY'
          import os, re
          e = os.environ
          release = e['EVENT_NAME'] == 'release' and e['EVENT_ACTION'] == 'published' and e['PRERELEASE'] == 'false'
          branch = e['EVENT_NAME'] in {'push', 'workflow_dispatch'} and e['REF'] == f'refs/heads/{e["DEFAULT_BRANCH"]}' and e['REF_PROTECTED'] == 'true'
          if not (release or branch): raise SystemExit('Publishing requires a final release or a protected default-branch push/manual run')
          image = e['IMAGE']
          if not image.startswith(f'ghcr.io/{e["OWNER"].lower()}/') or not re.fullmatch(r'ghcr\.io/[a-z0-9._-]+/[a-z0-9._/-]+', image): raise SystemExit('image must be a lowercase GHCR image owned by the caller')
          tag = e['RELEASE_TAG'] if release else ''
          if tag and not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}', tag): raise SystemExit('Release tag is not a valid container tag')
          with open(e['GITHUB_OUTPUT'], 'a') as output: output.write(f'image={image}\ntag={tag}\n')
          PY

  check:
    name: Validate container before publishing
    needs: validate
    uses: ./.github/workflows/docker.yml
    with:
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      platforms: ${{ inputs.platforms }}
      target: ${{ inputs.target }}

  publish:
    name: Publish approved container
    needs: [validate, check]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: containers
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.platforms != 'linux/amd64'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create commit and release tags
        id: tags
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo 'tags<<IMAGE_TAGS'
            echo "$IMAGE:sha-$SOURCE_SHA"
            if [[ -n "$TAG" ]]; then echo "$IMAGE:$TAG"; fi
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"
      - id: build
        name: Publish with provenance and SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: true
          pull: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
