name: Secret scanning

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Database credentials and tokens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          download_dir="$(mktemp -d)"
          cd "$download_dir"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          awk -v archive="$archive" '$2 == archive { print; found=1 } END { if (!found) exit 1 }' "gitleaks_${version}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Select commits to scan
        id: scope
        env:
          SCAN_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          kind = os.environ['SCAN_EVENT_NAME']
          base = head = ''
          if kind == 'pull_request':
              base = event.get('pull_request', {}).get('base', {}).get('sha', '')
              head = event.get('pull_request', {}).get('head', {}).get('sha', '')
          elif kind == 'push':
              base, head = event.get('before', ''), event.get('after', '')
          elif kind == 'merge_group':
              base = event.get('merge_group', {}).get('base_sha', '')
              head = event.get('merge_group', {}).get('head_sha', '')

          def available(sha):
              return bool(re.fullmatch(r'[0-9a-f]{40}', sha)) and sha != '0' * 40 and subprocess.run(
                  ['git', 'cat-file', '-e', sha + '^{commit}'], capture_output=True
              ).returncode == 0

          # Never guess a range when GitHub's base is missing (new branches,
          # force pushes with unavailable history, or non-change audit events).
          revision = base + '..' + head if available(base) and available(head) else 'HEAD'
          mode = 'introduced commits' if revision != 'HEAD' else 'complete history'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision + '\n')
          print('Scanning ' + mode + ': ' + revision)
          PYCODE
      - name: Scan database credentials and tokens
        env:
          SCAN_REVISION: ${{ steps.scope.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep policy outside the checkout; caller config cannot replace these rules.
          config="${RUNNER_TEMP}/shared-gitleaks.toml"
          cat > "$config" <<'TOML'
          title = "Shared database credential and token scanning"
          [extend]
          useDefault = true

          [[rules]]
          id = "database-connection-password"
          description = "Password embedded in a database connection URL"
          regex = '''(?i)(?:postgres(?:ql)?(?:\+[a-z0-9_]+)?|mysql(?:\+[a-z0-9_]+)?|mongodb(?:\+srv)?|redis(?:s)?)://(?:\$\{[^}\s]+\}|[^\s:/@]+):([^\s@/]+)@[^\s/"']+'''
          secretGroup = 1
          [[rules.allowlists]]
          description = "Template values"
          regexTarget = "secret"
          regexes = ['''^(?:your[-_]password|<[^>]+>|\$\{[A-Z_][A-Z0-9_]*\}|\$[A-Z_]+|\{(?:[A-Za-z_][A-Za-z0-9_]*(?:\[[0-9]+\])?|[0-9]*)\}|%s)$''']
          [[rules.allowlists]]
          description = "Conventional disposable credentials on local test services"
          regexTarget = "match"
          regexes = ['''://[^\s@]+:(?:(?:[a-z][a-z0-9]*[_-])?(?:password|pass|test(?:[_-]only)?|ci|dev|local|demo|example)|postgres|mysql|redis)@(?:localhost|127(?:\.[0-9]{1,3}){3}|\[::1\]|db|postgres|postgresql|mysql|mongo|mongodb|redis|\{[A-Z_][A-Z0-9_]*\})(?::[0-9]+)?$''']
          [[rules.allowlists]]
          description = "Literal URL syntax example"
          regexTarget = "match"
          regexes = ['''://user:pass@host$''']
          [[rules.allowlists]]
          description = "Conventional documentation credentials on reserved example domains"
          regexTarget = "match"
          regexes = ['''://[^\s@]+:(?:password|pass|test|demo|example)@(?:[a-z0-9-]+\.)*(?:invalid|example|example\.com|example\.net|example\.org)(?::[0-9]+)?$''']

          [[rules]]
          id = "generic-api-key"
          [[rules.allowlists]]
          description = "Explicit synthetic fixture values and public blockchain addresses"
          regexTarget = "secret"
          regexes = ['''(?i)^(?:(?:fake|dummy|example|fixture|synthetic|idemp)[_-][a-z0-9_-]+|0x[a-f0-9]{40})$''']
          TOML
          # Diagnostics show the rule, file, line, and fingerprint with secrets redacted.
          gitleaks git --config "$config" --redact=100 --verbose --log-opts="${SCAN_REVISION:-HEAD}" --exit-code 1 .
