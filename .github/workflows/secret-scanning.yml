name: Secret scanning

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Database credentials and tokens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          download_dir="$(mktemp -d)"
          cd "$download_dir"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          awk -v archive="$archive" '$2 == archive { print; found=1 } END { if (!found) exit 1 }' "gitleaks_${version}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan complete history for database credentials and tokens
        shell: bash
        run: |
          set -euo pipefail
          # Keep policy outside the checkout; caller config cannot replace these rules.
          config="${RUNNER_TEMP}/shared-gitleaks.toml"
          cat > "$config" <<'TOML'
          title = "Shared database credential and token scanning"
          [extend]
          useDefault = true

          [[rules]]
          id = "database-connection-password"
          description = "Password embedded in a database connection URL"
          regex = '''(?i)(?:postgres(?:ql)?(?:\+[a-z0-9_]+)?|mysql(?:\+[a-z0-9_]+)?|mongodb(?:\+srv)?|redis(?:s)?)://(?:\$\{[^}\s]+\}|[^\s:/@]+):([^\s@/]+)@'''
          secretGroup = 1
          [[rules.allowlists]]
          description = "Documented disposable local database passwords and template values"
          regexTarget = "secret"
          regexes = ['''^(?:omnicare_password|ci_test_only|password|pass|your[-_]password|<[^>]+>|\$\{[^}]+\}|\$[A-Z_]+|%s)$''']
          TOML
          gitleaks git --config "$config" --redact=100 --log-opts="--all" --exit-code 1 .
