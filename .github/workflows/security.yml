name: Security analysis

on:
  workflow_call:
    inputs:
      languages:
        description: CodeQL languages as JSON array
        required: false
        type: string
        default: '["python", "javascript-typescript"]'
      dependency-severity:
        description: low, moderate, high, or critical
        required: false
        type: string
        default: high
      config-file:
        description: Optional CodeQL configuration file in the consuming repository
        type: string
        default: ''
      build-command:
        description: Optional shell command to prepare and build compiled languages for CodeQL
        type: string
        default: ''
      enable-gitleaks:
        description: Run Gitleaks secret detection
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL ${{ matrix.language }}
    if: inputs.languages != '[]'
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate CodeQL inputs
        env:
          LANGUAGE: ${{ matrix.language }}
          CONFIG_FILE: ${{ inputs.config-file }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          languages = {'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'}
          if os.environ['LANGUAGE'] not in languages: raise SystemExit('Unsupported CodeQL language')
          if os.environ['CONFIG_FILE']:
              root = Path.cwd().resolve()
              path = Path(os.environ['CONFIG_FILE'])
              if path.is_absolute() or '..' in path.parts or not path.is_file() or not path.resolve().is_relative_to(root):
                  raise SystemExit('config-file must be a file inside the consuming repository')
          PY
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended
          config-file: ${{ inputs.config-file }}
          build-mode: ${{ contains(fromJSON('["c-cpp","csharp","go","java-kotlin","swift"]'), matrix.language) && (inputs.build-command != '' && 'manual' || 'autobuild') || 'none' }}
      - uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: inputs.build-command == '' && contains(fromJSON('["c-cpp","csharp","go","java-kotlin","swift"]'), matrix.language)
      - name: Build compiled language for analysis
        if: inputs.build-command != '' && contains(fromJSON('["c-cpp","csharp","go","java-kotlin","swift"]'), matrix.language)
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        shell: bash
        run: bash -euo pipefail -c "$BUILD_COMMAND"
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: New dependency risk
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.dependency-severity }}

  secrets:
    name: Secret scan (Gitleaks)
    if: inputs.enable-gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install and run Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.2"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks git --redact --verbose --exit-code 1 .
