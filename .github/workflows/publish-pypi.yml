name: PyPI publishing

on:
  workflow_call:
    inputs:
      project-dir:
        required: true
        type: string
      distribution-name:
        description: Exact Python distribution name expected in pyproject.toml
        required: true
        type: string

    secrets:
      PYPI_API_TOKEN:
        description: PyPI API token authorized to publish the requested distribution
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build release distribution
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.value }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Create unique release artifact name
        id: artifact-name
        env:
          PROJECT_DIR: ${{ inputs.project-dir }}
        run: |
          python - <<'PY'
          import hashlib, os, re
          project = os.environ['PROJECT_DIR']
          slug = re.sub(r'[^A-Za-z0-9._-]+', '-', project).strip('-.') or 'root'
          suffix = hashlib.sha256(project.encode()).hexdigest()[:10]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'value=release-dist-{slug[:80]}-{suffix}\n')
          PY
      - name: Check distribution and tag
        env:
          EXPECTED: ${{ inputs.distribution-name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert project['name'] == os.environ['EXPECTED']
          assert os.environ['TAG'] == f"v{project['version']}"
          PY
      - name: Build and validate
        run: |
          uv pip install --python python 'build==1.2.2.post1' 'twine==6.1.0'
          python -m build --installer=uv
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: ${{ inputs.project-dir }}/dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish from approved environment
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/${{ inputs.distribution-name }}
    permissions:
      contents: read
    steps:
      - name: Require the publishing credential
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::Configure and pass the PYPI_API_TOKEN Actions secret."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
