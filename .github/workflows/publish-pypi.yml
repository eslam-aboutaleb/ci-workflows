name: Reusable PyPI trusted publishing

on:
  workflow_call:
    inputs:
      project-dir:
        required: true
        type: string
      distribution-name:
        description: Exact Python distribution name expected in pyproject.toml
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build release distribution
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check distribution and tag
        env:
          EXPECTED: ${{ inputs.distribution-name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert project['name'] == os.environ['EXPECTED']
          assert os.environ['TAG'] == f"v{project['version']}"
          PY
      - name: Build and validate
        run: |
          python -m pip install 'build==1.2.2.post1' 'twine==6.1.0'
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: ${{ inputs.project-dir }}/dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish from approved environment
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/${{ inputs.distribution-name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
