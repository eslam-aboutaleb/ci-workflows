name: Reusable Playwright CI

on:
  workflow_call:
    inputs:
      project-dir:
        required: true
        type: string
      manager:
        description: npm or pnpm
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: '22'
      pnpm-version:
        description: Optional pnpm version; leave empty to use packageManager in the caller package.json
        required: false
        type: string
        default: ''
      test-script:
        description: Existing Playwright script; default test:e2e
        required: false
        type: string
        default: test:e2e

permissions:
  contents: read

jobs:
  playwright:
    name: Browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: inputs.manager == 'pnpm'
        with:
          version: ${{ inputs.pnpm-version }}
          package_json_file: ${{ inputs.project-dir }}/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install and run Playwright
        env:
          MANAGER: ${{ inputs.manager }}
          TEST_SCRIPT: ${{ inputs.test-script }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TEST_SCRIPT" =~ ^[a-zA-Z0-9:_-]+$ ]]
          node -e 'const p=require("./package.json"); if (!p.scripts?.[process.env.TEST_SCRIPT]) process.exit(2)'
          case "$MANAGER" in
            npm) npm ci; npx playwright install --with-deps chromium; npm run "$TEST_SCRIPT" ;;
            pnpm) pnpm install --frozen-lockfile; pnpm exec playwright install --with-deps chromium; pnpm run "$TEST_SCRIPT" ;;
            *) exit 2 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: ${{ inputs.project-dir }}/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
