name: Propagate CI updates

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target-sha:
        description: Optional 40-character commit SHA to propagate (defaults to HEAD)
        required: false
        type: string
        default: ''
      repository:
        description: Optional single owner/repo to update (defaults to all in .github/downstream.json)
        required: false
        type: string
        default: ''
      dry-run:
        description: Validate and preview updates without pushing branches or opening PRs
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: propagate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  propagate:
    name: Open downstream update PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Propagate workflow SHA to downstream repositories
        env:
          GH_TOKEN: ${{ secrets.CI_PROPAGATION_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ inputs.target-sha || github.sha }}
          TARGET_REPO: ${{ inputs.repository || '' }}
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" && "${DRY_RUN}" != "true" ]]; then
            if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "::error::Secret CI_PROPAGATION_TOKEN is required to push branches and open PRs in downstream repositories."
              exit 1
            fi
            echo "::notice::Skipping downstream propagation: configure secret CI_PROPAGATION_TOKEN to enable automatic downstream PR creation."
            exit 0
          fi
          ARGS=(--target-sha "${TARGET_SHA}")
          if [[ -n "${TARGET_REPO}" ]]; then
            ARGS+=(--repo "${TARGET_REPO}")
          fi
          if [[ "${DRY_RUN}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          python3 .github/scripts/propagate_updates.py "${ARGS[@]}"
