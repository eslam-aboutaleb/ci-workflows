name: Validate reusable workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actionlint:
    name: Actionlint and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate reusable workflow contracts
        run: |
          python -m pip install 'PyYAML==6.0.2'
          python - <<'PY'
          from pathlib import Path
          import yaml
          class Loader(yaml.SafeLoader):
              pass
          for key, values in list(Loader.yaml_implicit_resolvers.items()):
              Loader.yaml_implicit_resolvers[key] = [
                  item for item in values if item[0] != 'tag:yaml.org,2002:bool'
              ]
          root = Path('.github/workflows')
          for path in sorted(root.glob('*.yml')):
              data = yaml.load(path.read_text(), Loader=Loader)
              assert isinstance(data, dict) and data.get('jobs'), path
              assert data['permissions']['contents'] == 'read', path
              assert 'pull_request_target' not in data['on'], path
              if path.name != 'validate.yml':
                  assert set(data['on']) == {'workflow_call'}, path
              for job in data['jobs'].values():
                  assert job['permissions']['contents'] == 'read', path
              print(path)
          PY
      - name: Install and run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/*.yml
