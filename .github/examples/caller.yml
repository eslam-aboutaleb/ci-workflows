# Copy to .github/workflows/ci.yml in a consuming repository.
# Replace COMMIT_SHA with a reviewed full 40-character commit SHA.
name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/ci.yml@COMMIT_SHA
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
    secrets:
      AI_EVAL_API_KEY: ${{ secrets.AI_EVAL_API_KEY }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
