name: Infrastructure drift
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/terraform-drift.yml@COMMIT_SHA
    with:
      project-dir: infrastructure/stacks/oci/production
      stack-id: oci-production
      terraform-version: 1.12.2
      terramate-version: 0.11.6
      environment: infrastructure-read
      backend-config: ${{ vars.TF_BACKEND_CONFIG_JSON }}
      oci-config: ${{ vars.OCI_CONFIG_JSON }}
      fail-on-drift: true
    secrets:
      OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
      PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
